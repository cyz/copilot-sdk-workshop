name: Validate workshop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nodejs:
    name: Node.js / TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            start-museum/nodejs/package-lock.json
            finished/nodejs/museum-exhibit-studio/package-lock.json

      - name: Build starter and finished app
        run: bash scripts/validate-workshop.sh nodejs

      - name: Builds leave the repository clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
